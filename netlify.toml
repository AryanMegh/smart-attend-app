# Netlify settings so the deployed site behaves like local dev.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every route (e.g. /attendance on refresh) serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never let browsers/CDN keep an old index.html: a stale one points at deleted
# JS bundles and breaks the app after each deploy. Hashed assets are cached forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
